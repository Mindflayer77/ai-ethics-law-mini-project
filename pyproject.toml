[project]
name = "ai-ethics-law-mini-project"
version = "0.1.0"
description = "Mini-projekt — Aspekty prawne, społeczne i etyczne w AI (PWr 2025/2026)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.82",
    "anthropic>=0.52",
    "google-genai>=1.14",
    "loguru>=0.7",
    "python-dotenv>=1.1",
    "pandas>=2.2",
    "matplotlib>=3.9",
    # Audyt licencji zależności projektu
    "requests>=2.32",
    "jinja2>=3.1",
    "click>=8.1",
    "packaging>=24.0",
    "pyrtlsdr"
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[project.scripts]
audyt-licencji = "main:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
